name: Deploy

# Deploys to Cloudflare once CI passes on main. Needs the repo secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and BIGQUERY_CREDENTIALS, a
# Google Cloud service account key, for PyPI download counts. PROJECT_REPOS_TOKEN,
# a read-only GitHub token for every project repo, is optional: without it, the
# private ones' glyphs keep the profile's counts.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://bvandercar.dev/

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # The commit CI passed on, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup
        uses: ./.github/actions/setup

      # Always fetched fresh here, then saved for that day's previews to
      # reuse.
      - name: Build site
        uses: ./.github/actions/build-site
        with:
          # The workflow's own token reads public repos; PROJECT_REPOS_TOKEN,
          # if set, reads every project repo, private ones too.
          github-token: ${{ secrets.PROJECT_REPOS_TOKEN || github.token }}
          bigquery-credentials: ${{ secrets.BIGQUERY_CREDENTIALS }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
