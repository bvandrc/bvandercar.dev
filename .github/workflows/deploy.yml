name: Deploy

# Deploys to Cloudflare once CI passes on main. Needs the repo secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, BIGQUERY_CREDENTIALS, a Google
# Cloud service account key, for PyPI download counts, and PROJECT_REPOS_TOKEN,
# a read-only GitHub token for every project repo, private ones included. The
# build fails if any project's counts can't be fetched, so the live site never
# shows the profile's older counts in their place.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://bvandercar.dev/

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # The commit CI passed on, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup
        uses: ./.github/actions/setup

      # Always fetched fresh here, then saved for that day's previews to
      # reuse.
      - name: Build site
        uses: ./.github/actions/build-site
        with:
          github-token: ${{ secrets.PROJECT_REPOS_TOKEN }}
          bigquery-credentials: ${{ secrets.BIGQUERY_CREDENTIALS }}
          require-fetched-data: true
          # Set the repo variable to true for one deploy where the account's
          # commits or PRs really did go down, as after a repo it committed
          # to is deleted, then unset it.
          allow-account-activity-drop: ${{ vars.ALLOW_ACCOUNT_ACTIVITY_DROP == 'true' }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
