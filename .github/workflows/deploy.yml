name: Deploy

# Deploys to Cloudflare once CI passes on main. Needs the repo secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and BIGQUERY_CREDENTIALS, a
# Google Cloud service account key, for PyPI download charts. PROJECT_REPOS_TOKEN,
# a read-only GitHub token for every project repo, is optional: without it, the
# private ones' cards show no commits chart.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://bvandercar.dev/
    env:
      # Whether the secret is set, without putting the key itself in every step's env.
      HAS_BIGQUERY_CREDENTIALS: ${{ secrets.BIGQUERY_CREDENTIALS != '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # The commit CI passed on, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup
        uses: ./.github/actions/setup

      # For the PyPI download charts, which the build queries from BigQuery.
      # Without the secret, the build still passes and PyPI projects show none.
      # PyPI's daily download counts from earlier runs, so the build queries
      # BigQuery for just the days since. Each run saves its own copy, and
      # the next restores the newest.
      - name: Cache PyPI downloads
        if: env.HAS_BIGQUERY_CREDENTIALS == 'true'
        uses: actions/cache@v6
        with:
          path: .cache
          key: pypi-downloads-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pypi-downloads-

      - name: Authenticate to Google Cloud
        if: env.HAS_BIGQUERY_CREDENTIALS == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.BIGQUERY_CREDENTIALS }}

      - name: Build project
        run: pnpm build
        env:
          # For the activity charts. The workflow's own token reads public
          # repos; PROJECT_REPOS_TOKEN, if set, reads every project repo,
          # private ones too.
          GITHUB_TOKEN: ${{ secrets.PROJECT_REPOS_TOKEN || github.token }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
