name: Delete Old Preview Aliases

# Deletes the Cloudflare versions that preview.yml uploaded under a
# `--preview-alias` before PR previews moved to Worker Previews. Wrangler has
# no command to remove those aliases, and an alias still serves its URL once a
# PR's Worker Preview is deleted. Run it by hand for one alias first, to check
# its URL stops serving, then for all of them. Never deletes a version a
# deployment serves.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'One alias to delete, like pr-85; leave empty for every PR alias'
        type: string
        required: false

permissions:
  contents: read

jobs:
  delete:
    name: Delete old preview aliases
    runs-on: ubuntu-latest

    steps:
      - name: Delete aliased versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The `name` in wrangler.jsonc.
          WORKER: bvandercar-dev
          ALIAS: ${{ inputs.alias }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          cf() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }

          deployed=$(cf "$api/scripts/$WORKER/deployments" | jq -c '[.result.deployments[].versions[].version_id]')

          # A version's `--preview-alias` is its `workers/alias` annotation,
          # which only this beta endpoint returns.
          versions='[]'
          page=1
          while :; do
            batch=$(cf "$api/workers/$WORKER/versions?page=$page&per_page=100" | jq -c '.result')
            [ "$(jq length <<< "$batch")" -eq 0 ] && break
            versions=$(jq -c --argjson batch "$batch" '. + $batch' <<< "$versions")
            page=$((page + 1))
          done

          stale=$(jq -r --arg alias "$ALIAS" --argjson deployed "$deployed" '
            .[]
            | (.annotations["workers/alias"] // "") as $a
            | select(if $alias != "" then $a == $alias else $a | test("^pr-[0-9]+$") end)
            | select(.id as $id | $deployed | any(. == $id) | not)
            | "\(.id) \($a)"
          ' <<< "$versions")

          if [ -z "$stale" ]; then
            echo "No aliased versions to delete."
            exit 0
          fi
          while read -r id alias; do
            echo "Deleting $alias version $id"
            cf -X DELETE "$api/workers/$WORKER/versions/$id" > /dev/null
          done <<< "$stale"
          echo "Deleted $(wc -l <<< "$stale") aliased versions." >> "$GITHUB_STEP_SUMMARY"
