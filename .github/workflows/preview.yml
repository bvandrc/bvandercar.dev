name: Preview

# Uploads each PR's build as a Cloudflare version, without deploying it, and
# links its preview URL from the PR's "View deployment" button, which posts no
# comment. The `pr-<number>` alias keeps one stable URL per PR across pushes.
#
# The data the build fetches from GitHub, npm, and BigQuery is reused from a
# preview or deploy that fetched it the same UTC day, with the same scripts, so
# it has the shape this build expects. Add the `refresh-data` label to build a
# preview with fresh data; while the label stays, every push fetches fresh
# data.

on:
  pull_request:
    # Labeled only for `refresh-data`, which the job checks.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    # A fork PR gets no secrets, so it can't upload. Any label but
    # `refresh-data` leaves the preview as it was.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'refresh-data')
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    env:
      # Whether the secret is set, without putting the key itself in every step's env.
      HAS_BIGQUERY_CREDENTIALS: ${{ secrets.BIGQUERY_CREDENTIALS != '' }}
      REFRESH_DATA: ${{ contains(github.event.pull_request.labels.*.name, 'refresh-data') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Get today's date
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Today's data from a preview or deploy that fetched it with these same
      # scripts, which a PR can restore from its own runs or from main's.
      # Saved once the job passes, if there was none to restore.
      - name: Cache fetched data
        id: data
        if: env.REFRESH_DATA != 'true'
        uses: actions/cache@v6
        with:
          path: src/generated/*.ts
          key: fetched-data-${{ hashFiles('scripts/fetch-activity.ts', 'scripts/fetch-downloads.ts') }}-${{ steps.today.outputs.date }}

      # For PyPI's download counts, which the build queries from BigQuery.
      # Without the secret, the build still passes and PyPI projects show none.
      # PyPI's daily download counts from earlier runs, so the build queries
      # BigQuery for just the days since. Each run saves its own copy, and
      # the next restores the newest.
      - name: Cache PyPI downloads
        # Nothing queries BigQuery when the fetched data is reused.
        if: env.HAS_BIGQUERY_CREDENTIALS == 'true' && steps.data.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: .cache
          key: pypi-downloads-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pypi-downloads-

      - name: Authenticate to Google Cloud
        if: env.HAS_BIGQUERY_CREDENTIALS == 'true' && steps.data.outputs.cache-hit != 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.BIGQUERY_CREDENTIALS }}

      - name: Build project
        run: pnpm build
        env:
          # For the repos' commit and PR counts. The workflow's own token reads public
          # repos; PROJECT_REPOS_TOKEN, if set, reads every project repo,
          # private ones too.
          GITHUB_TOKEN: ${{ secrets.PROJECT_REPOS_TOKEN || github.token }}
          # Keeps the restored data rather than fetching it again.
          REUSE_FETCHED_DATA: ${{ steps.data.outputs.cache-hit == 'true' }}

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler versions upload --preview-alias "pr-$PR_NUMBER"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          # Cloudflare only returns a preview URL once a deploy has applied
          # `preview_urls: true` to the Worker, and the account has a
          # workers.dev subdomain.
          if [ -z "$url" ]; then
            echo "::error::No preview URL returned. Check that the account has a workers.dev subdomain and that a deploy has applied preview_urls: true."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "**Preview:** $url" >> "$GITHUB_STEP_SUMMARY"
