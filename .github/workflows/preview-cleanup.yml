name: Preview Cleanup

# Deletes the Cloudflare versions preview.yml uploaded for a PR once it closes,
# so its `pr-<number>` preview URL stops serving. Run it by hand to sweep the
# previews of every PR that isn't open, as for those closed before this
# workflow existed. A version any deployment serves is never deleted.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Shares preview.yml's group, so closing a PR cancels a preview still
# uploading, which would otherwise outlive the cleanup.
concurrency:
  group: preview-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Delete preview versions
    runs-on: ubuntu-latest
    # A fork PR never got a preview to delete.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Delete preview versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          # The `name` in wrangler.jsonc.
          WORKER: bvandercar-dev
          # Empty for a sweep, which deletes every PR alias but the open PRs'.
          ALIAS: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || '' }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          cf() { curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }

          deployed=$(cf "$api/scripts/$WORKER/deployments" | jq -c '[.result.deployments[].versions[].version_id]')
          if [ -z "$ALIAS" ]; then
            open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '[.[].number]')
          else
            open='[]'
          fi

          # Wrangler records a version's `--preview-alias` as its
          # `workers/alias` annotation, which only this beta endpoint returns.
          versions='[]'
          page=1
          while :; do
            batch=$(cf "$api/workers/$WORKER/versions?page=$page&per_page=100" | jq -c '.result')
            [ "$(jq length <<< "$batch")" -eq 0 ] && break
            versions=$(jq -c --argjson batch "$batch" '. + $batch' <<< "$versions")
            page=$((page + 1))
          done

          stale=$(jq -r --arg alias "$ALIAS" --argjson open "$open" --argjson deployed "$deployed" '
            .[]
            | (.annotations["workers/alias"] // "") as $a
            | select(
                if $alias != "" then $a == $alias
                else ($a | test("^pr-[0-9]+$")) and (($a[3:] | tonumber) as $n | $open | any(. == $n) | not)
                end
              )
            | select(.id as $id | $deployed | any(. == $id) | not)
            | "\(.id) \(.annotations["workers/alias"])"
          ' <<< "$versions")

          if [ -z "$stale" ]; then
            echo "No preview versions to delete."
            exit 0
          fi
          while read -r id alias; do
            echo "Deleting $alias version $id"
            cf -X DELETE "$api/workers/$WORKER/versions/$id" > /dev/null
          done <<< "$stale"
          echo "Deleted $(wc -l <<< "$stale") preview versions." >> "$GITHUB_STEP_SUMMARY"
