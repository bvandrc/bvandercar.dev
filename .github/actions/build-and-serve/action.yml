name: Build and serve
description: Build the app, start it, and wait until it responds.

inputs:
  port:
    description: Port the server listens on
    required: false
    default: '4173'
  base-path:
    description: Base path the app is served under (must match BASE_PATH in site.config.ts)
    required: false
    default: /

runs:
  using: composite

  steps:
    - name: Build
      run: pnpm build
      shell: bash
      env:
        # Reads the public repos' activity, so the browser suites see its counts.
        GITHUB_TOKEN: ${{ github.token }}

    - name: Start server
      run: pnpm preview:ci &
      shell: bash

    - name: Wait for server to be ready
      uses: jtalk/url-health-check-action@v5
      with:
        url: http://localhost:${{ inputs.port }}${{ inputs.base-path }}
        max-attempts: 30
        retry-delay: 1s
        retry-all: true
